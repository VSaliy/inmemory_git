plugins {
    id 'java-library'
    id 'application'
}

group = 'io.github.inmemorygit'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.github.inmemorygit.Demo'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}

tasks.register('fsckFixture', JavaExec) {
    group = 'verification'
    description = 'Builds a fixture repository and runs in-memory fsck checks.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.inmemorygit.Cli'
    args 'fsck'
}
